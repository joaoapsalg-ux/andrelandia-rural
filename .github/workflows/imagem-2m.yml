# Gera blocos de 2 m (CBERS-4A) para células escolhidas, lendo só o recorte no COG do INPE (tools/build_cbers2m.py,
# modo "puro": a imagem de 2 m com a cor do mapa atual em escala grande). Não publica nada: devolve as imagens como
# artefato, para conferir antes de entrarem no app.
name: Imagem de 2 m

on:
  workflow_dispatch:
    inputs:
      cells:
        description: 'Células r_c separadas por vírgula'
        default: '6_11,6_12,7_11,7_12'
      variants:
        description: 'Versões, uma por linha de "tag: opções" (ex.: "_b: --order 3 --unsharp 0.4 --quality 92")'
        default: ': '

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet rasterio numpy scipy pillow
      - name: Ler o recorte de 2 m e fundir (uma passada por versão)
        env:
          CELLS: ${{ inputs.cells }}
          VARIANTS: ${{ inputs.variants }}
        run: |
          printf '%s\n' "$VARIANTS" | tr ';' '\n' | while IFS=: read -r tag opts; do
            [ -z "$tag$opts" ] && continue
            echo "== versão '${tag}': ${opts}"
            python tools/build_cbers2m.py --cells "$CELLS" --out out2m --tag "$tag" $opts
          done
      - uses: actions/upload-artifact@v4
        with:
          name: imagem-2m
          path: out2m
